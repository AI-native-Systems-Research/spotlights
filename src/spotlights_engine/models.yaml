# Which model each agent CLI runs on, for every step of the pipeline.
#
# Leave a value blank to inherit that CLI's own default — `~/.claude/settings.json`
# for claude, `~/.codex/config.toml` for codex.
#
# Ships blank on purpose. Blank means nothing changes: no step switches model,
# and every existing run dir still resumes (these values are part of the resume
# fingerprint). Pinning something here would be a silent change to whoever
# upgrades. Model ids are also gateway-specific aliases, so a shipped default
# would be wrong for anyone on a different gateway.
#
# Set a value to apply it to every step:
#
#     claude: aws/claude-opus-4-8
#     codex: gpt-5.5
#
# One exception worth knowing: candidate discovery (step 2) has its own built-in
# Codex default of gpt-5.5, kept for resume compatibility. Leaving `codex` blank
# leaves step 2 on gpt-5.5 while steps 3 and 5 inherit ~/.codex/config.toml.
# Setting `codex` here makes all three consistent.
#
# Override for a single run without editing this file:
#
#     spotlights-engine --claude-model aws/claude-opus-4-8 --codex-model gpt-5.5 ...
#
# For a preference that is yours and not the team's, do NOT edit this file: it is
# tracked by git, so your edit can be pushed by accident, and a later upstream
# change to it will block your `git pull` until you stash. Keep your own copy
# outside the repo instead and point `SPOTLIGHTS_MODELS_FILE` at it:
#
#     export SPOTLIGHTS_MODELS_FILE=~/.config/spotlights/models.yaml
#
# Editing this file is for changing the default for everyone.
#
# `spotlights-engine doctor` prints the effective model per CLI and where it
# came from.

claude:            # e.g. aws/claude-opus-4-8, aws/claude-opus-5, opus, sonnet
codex:             # e.g. gpt-5.5 (step 2 already defaults to this)
