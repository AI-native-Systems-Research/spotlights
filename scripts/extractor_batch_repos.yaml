# Format (validated by the pydantic models inside the batch script):
#
#   defaults:              # optional; any ExtractorConfig field by name,
#     timeout_s: 5400      # applied to every repo (per-repo `overrides` win)
#     enrich_sharding: auto
#
#   repos:                 # exactly one of `path` / `url` per repo
#     - name: <unique>     # filesystem-safe ([A-Za-z0-9._-]+); output sub-folder
#       path: <local dir>  # relative paths resolve against the spotlight-engine root
#       overrides: {}      # optional per-repo ExtractorConfig overrides
#     - name: <unique>
#       url: <git url>     # cloned on demand into <output_root>/_clones/<name>
#       ref: <branch|tag|sha>  # optional; default = remote HEAD

