<svg viewBox="0 0 900 1000" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Inter, system-ui, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4a4a"/>
    </marker>
    <marker id="arr-bus" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <style>
      .title  { font-weight:600; font-size:15px; fill:#1a1a1a; }
      .body   { font-weight:400; font-size:12px; fill:#4a4a4a; }
      .mono   { font-family: ui-monospace, Menlo, monospace; font-weight:500; font-size:13px; fill:#1a1a1a; }
      .line   { stroke:#4a4a4a; stroke-width:1.6; fill:none; }
      .panel  { fill:#fff; stroke:#1a1a1a; stroke-width:1.4; }
      .mgr    { fill:#fffbe6; stroke:#a16207; stroke-width:1.6; stroke-dasharray:6 4; }
      .s0     { fill:#f5f5f5; stroke:#525252; stroke-width:1.6; }
      .s1     { fill:#fff7e6; stroke:#d97706; stroke-width:1.6; }
      .s2     { fill:#f3edff; stroke:#7c3aed; stroke-width:1.6; }
      .s4     { fill:#fef2f2; stroke:#dc2626; stroke-width:1.6; }
      .s5     { fill:#fff1f7; stroke:#be185d; stroke-width:1.6; }
      .skip   { fill:#f1f5f9; stroke:#64748b; stroke-width:1.4; stroke-dasharray:4 3; }
      .out    { fill:#ecfdf5; stroke:#059669; stroke-width:1.6; }
      .label  { font-weight:600; font-size:11px; fill:#666; letter-spacing:0.08em; }
      .loop   { fill:none; stroke:#1a1a1a; stroke-width:1.2; stroke-dasharray:5 5; }
      .bus       { stroke:#7c3aed; stroke-width:1.2; stroke-dasharray:3 3; fill:none; }
      .bus-tap   { stroke:#7c3aed; stroke-width:1.2; fill:none; }
      .bus-label { font-weight:600; font-size:11px; fill:#7c3aed; letter-spacing:0.08em; }
      .note      { font-style:italic; font-size:11px; fill:#666; }
    </style>
  </defs>

  <rect width="900" height="1000" fill="#fafafa"/>

  <!-- INPUTS -->
  <g transform="translate(220,20)">
    <rect width="200" height="44" rx="8" class="panel"/>
    <text x="100" y="28" text-anchor="middle" class="mono">repo</text>
  </g>
  <g transform="translate(440,20)">
    <rect width="240" height="44" rx="8" class="panel"/>
    <text x="120" y="28" text-anchor="middle" class="mono">SpotlightContext</text>
  </g>
  <path class="line" marker-end="url(#arr)" d="M320 64 V 90"/>
  <path class="line" marker-end="url(#arr)" d="M560 64 V 90"/>

  <!-- SpotlightsManager wrapper -->
  <g transform="translate(30,90)">
    <rect width="840" height="860" rx="12" class="mgr"/>
    <text x="20" y="26" class="label">ORCHESTRATOR</text>
    <text x="20" y="50" class="title">SpotlightsManager</text>
    <text x="20" y="70" class="body">Calls ModulesExtractor once, then runs steps 2, 3, 4, 5 per target (leaf) module.</text>
  </g>

  <!-- Step 1: ModulesExtractor -->
  <g transform="translate(280,200)">
    <rect width="340" height="80" rx="10" class="s0"/>
    <text x="20" y="28" class="label">STEP 1</text>
    <text x="20" y="52" class="title">ModulesExtractor</text>
    <text x="20" y="70" class="body">repo -&gt; ProjectModules (Repository + module tree)</text>
  </g>
  <text x="630" y="248" class="note">context not used</text>
  <path class="line" marker-end="url(#arr)" d="M450 280 V 320"/>
  <text x="460" y="308" class="label">FOR EACH TARGET MODULE</text>

  <!-- per-module loop frame -->
  <rect x="60" y="320" width="780" height="600" rx="12" class="loop"/>

  <!-- Step 2 -->
  <g transform="translate(170,355)">
    <rect width="560" height="110" rx="10" class="s1"/>
    <text x="20" y="28" class="label">STEP 2</text>
    <text x="20" y="52" class="title">candidate_discovery</text>
    <text x="20" y="74" class="body">Claude &lt;-&gt; Codex alternating review of one module.</text>
    <text x="20" y="92" class="body">In: project_tree + module_qualified_name + context</text>
    <text x="20" y="108" class="body">Out: Candidates</text>
  </g>

  <!-- Branch: empty candidates -> SKIPPED -->
  <path class="line" marker-end="url(#arr)" d="M730 410 H 800 V 440"/>
  <text x="735" y="402" class="label">EMPTY</text>
  <g transform="translate(720,440)">
    <rect width="110" height="44" rx="8" class="skip"/>
    <text x="55" y="28" text-anchor="middle" class="mono">SKIPPED</text>
  </g>

  <!-- Step 2 -> Step 3 -->
  <path class="line" marker-end="url(#arr)" d="M450 465 V 505"/>

  <!-- Step 3 -->
  <g transform="translate(170,505)">
    <rect width="560" height="120" rx="10" class="s2"/>
    <text x="20" y="28" class="label">STEP 3</text>
    <text x="20" y="52" class="title">module_deep_research</text>
    <text x="20" y="74" class="body">Per-module web / lit survey. Builds its own prompt from Repository + Module.</text>
    <text x="20" y="92" class="body">In: project_tree + module_qualified_name + context + max_findings_per_module</text>
    <text x="20" y="110" class="body">Out: list[Finding] (may be empty) + issues</text>
  </g>
  <path class="line" marker-end="url(#arr)" d="M450 625 V 665"/>

  <!-- Step 4 -->
  <g transform="translate(170,665)">
    <rect width="560" height="120" rx="10" class="s4"/>
    <text x="20" y="28" class="label">STEP 4</text>
    <text x="20" y="52" class="title">proposal_from_finding_creator</text>
    <text x="20" y="74" class="body">For each (candidate, finding) pair: draft a DeepResearchProposal, or skip.</text>
    <text x="20" y="92" class="body">In: candidates + findings + context</text>
    <text x="20" y="110" class="body">Out: candidate.deep_research_proposals[]</text>
  </g>
  <path class="line" marker-end="url(#arr)" d="M450 785 V 805"/>

  <!-- Step 5 -->
  <g transform="translate(170,805)">
    <rect width="560" height="100" rx="10" class="s5"/>
    <text x="20" y="28" class="label">STEP 5</text>
    <text x="20" y="52" class="title">agent_proposals</text>
    <text x="20" y="74" class="body">Agent-knowledge proposals NOT covered by deep_research_proposals.</text>
    <text x="20" y="92" class="body">In: project_tree + candidates + context  -&gt;  Out: candidate.agent_proposals[]</text>
  </g>

  <!-- OUTPUT -->
  <path class="line" marker-end="url(#arr)" d="M450 945 V 965"/>
  <g transform="translate(300,955)">
    <rect width="300" height="40" rx="8" class="out"/>
    <text x="150" y="26" text-anchor="middle" class="mono">SpotlightsResult (module_runs)</text>
  </g>

</svg>
