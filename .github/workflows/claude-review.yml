name: Claude Code Action

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  check-permissions:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - name: Check invoker permissions
        id: check
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: context.actor
              });
              const allowed = ['admin', 'write', 'maintain'].includes(data.permission);
              core.setOutput('allowed', allowed ? 'true' : 'false');
              if (!allowed) {
                core.info(`User ${context.actor} has '${data.permission}' permission — skipping.`);
              }
            } catch (e) {
              core.setOutput('allowed', 'false');
              core.info(`User ${context.actor} is not a collaborator — skipping.`);
            }

  claude:
    needs: check-permissions
    if: |
      always() && (
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name != 'pull_request' &&
         needs.check-permissions.outputs.allowed == 'true')
      )
    runs-on: [self-hosted]
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set prompt for PR review
        id: set-prompt
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            {
              echo 'prompt<<PROMPT_EOF'
              echo '/code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
              echo ''
              echo 'When posting the review comment prefix it with ## 🤖 Claude Code Review'
              echo 'PROMPT_EOF'
            } >> $GITHUB_OUTPUT
          else
            echo "prompt=" >> $GITHUB_OUTPUT
          fi

      - uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
          CLAUDE_CODE_DISABLE_THINKING: "1"
          CLAUDE_CONFIG_DIR: /tmp/claude-ci-config
          GH_HOST: github.com
        with:
          anthropic_api_key: ${{ secrets.LITELLM_API_KEY }}
          allowed_bots: 'github-actions,claude'
          claude_args: '--model claude-sonnet-4-6 --allowedTools "Skill Agent Bash Read Edit Write"'
          show_full_output: true
          plugin_marketplaces: |
            https://github.com/anthropics/claude-plugins-official.git
            https://github.com/obra/superpowers-marketplace.git
          plugins: |
            code-review@claude-plugins-official
            superpowers@superpowers-marketplace
          prompt: ${{ steps.set-prompt.outputs.prompt }}
