[project]
name = "spotlights-engine"
version = "0.1.0"
description = "Propose high-leverage, evidence-backed code changes for a target repo."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Spotlight Engine contributors" }]
keywords = ["llm", "code-analysis", "agent", "performance", "research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pydantic>=2"
]

[project.urls]
Homepage      = "https://github.com/AI-native-Systems-Research/spotlights"
Documentation = "https://github.com/AI-native-Systems-Research/spotlights#readme"
Issues        = "https://github.com/AI-native-Systems-Research/spotlights/issues"
Source        = "https://github.com/AI-native-Systems-Research/spotlights"

[project.scripts]
spotlights-engine = "spotlights_engine.cli:main"

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pre-commit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Path-source overrides for the sibling repos are intentionally NOT shipped in
# the public pyproject.toml — they would break any clone outside a maintainer's
# machine. Contributors who need editable installs of the siblings should keep
# those overrides in a personal `uv.toml` or a separate `pyproject.dev.toml`.

[tool.hatch.build.targets.wheel]
packages = ["src/spotlights_engine"]

[tool.hatch.build.targets.sdist]
exclude = [
    "tmp/",
    "dist/",
    "examples/**/artifacts/**",
    "scripts/__pycache__/",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
