[project]
name = "spotlight-engine"
version = "0.0.0"
description = "Spotlight Engine spine: schemas, orchestration, integration tests, and the demo path."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Spotlight Engine contributors" }]
dependencies = [
    "spotlight-observability",
    "spotlight-knowledge",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pre-commit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spotlights_engine"]

[tool.uv.sources]
spotlight-observability = { path = "../spotlight-observability", editable = true }
spotlight-knowledge = { path = "../spotlight-knowledge", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
