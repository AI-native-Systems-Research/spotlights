    ## Research findings (4)
    1. Cascade Inference: Memory Bandwidth Efficient Shared Prefix Batch Decoding — blog — https://flashinfer.ai/2024/02/02/cascade-inference.html
       Technique: Use recursive attention state merging to split shared-prefix attention from per-request suffix attention, then dispatch each part to the kernel best suited for its reuse pattern. For multi-turn agentic workloads with repeated system/tool/document prefixes, the module could make cascade selection more shape-aware and extend it toward multi-level shared prefixes rather than relying on coarse gates. | Evidence: "Quote: "Use multi-query (prefill/append) attention kernel" and "Use batch decode attention kernel". Pointer: Cascade Inference: The Algorithm, steps 1-2."
    2. flashinfer.cascade — docs — https://docs.flashinfer.ai/api/cascade.html
       Technique: Cache cascade planning auxiliary structures and reuse them across multiple layer calls for the same decode step. The module could mirror this at metadata-build time by keying stable shape/page/cascade plans and reusing preallocated CUDA-graph buffers to lower per-step planning overhead and median TPOT. | Evidence: "Quote: "auxiliary data structures can be reused across multiple batch decode attention calls". Pointer: MultiLevelCascadeAttentionWrapper example note."
    3. CUDA C++ Best Practices Guide — docs — https://docs.nvidia.com/cuda/cuda-c-best-practices-guide/index.html
       Technique: Minimize host-device transfers, batch many small transfers into one contiguous transfer, and use pinned memory for asynchronous copies. The module could apply this to attention metadata construction by packing indptr, last-page lengths, multimodal ranges, and split metadata into fewer staged H2D copies or moving cheap prefix computations onto device. | Evidence: "Quote: "batching many small transfers into one larger transfer performs significantly better". Pointer: Data Transfer Between Host and Device, section 10.1."
    4. CUDA Graphs — docs — https://docs.vllm.ai/en/v0.21.0/design/cuda_graphs/
       Technique: Use a batch-descriptor-driven CUDA graph dispatcher that separately handles uniform decode and mixed/prefill batches, with backend capability fallbacks. The attention module could tighten its fast-plan and metadata decisions around stable batch descriptors so CUDA-graph-compatible decode routes avoid redundant planning while mixed batches safely fall back. | Evidence: "Quote: "dispatch between full and piecewise cudagraph at runtime". Pointer: Motivation, lines 2736-2742."

