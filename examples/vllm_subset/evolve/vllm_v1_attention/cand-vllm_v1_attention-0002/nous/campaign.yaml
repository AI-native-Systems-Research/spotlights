    - [proposal_from_finding_creator] Coalesce per-step H2D metadata copies and eliminate cascade tiny-tensor allocations in FlashAttentionMetadataBuilder.build — The finding directly addresses two concrete inefficiencies in build's per-step path that the candidate's evolve_rationale explicitly flags: (a) cascade paths allocate cu_prefix_query_lens and prefix_kv_lens tensors via torch.tensor with device=self.device, which triggers an implicit H2D transfer plus a fresh device allocation on every step cascade is active; and (b) mm_prefix and R-SWA both perform independent H2D staging copies. The CUDA Best Practices Guide's "batch many small transfers" and "use pinned memory for asynchronous copies" recommendations map 1:1 onto these sites. For a multi-turn agentic workload where build runs every decode step, cutting even a handful of small H2D launches per step reduces per-token host overhead and improves median TPOT; on prefill steps (where cascade and mm_prefix are more likely active) it also reduces TTFT. The change is transferable, scoped to build, and correctness is checkable via the existing metadata tests and end-to-end equality oracle called out in the candidate. (from finding #3: CUDA C++ Best Practices Guide)
    - [proposal_from_finding_creator] Cache CUDA-graph-compatible plans keyed by stable batch descriptors in FlashAttentionMetadataBuilder.build — The candidate's evolve_rationale explicitly names caching schedule() by repeated shape and reusing cascade prefix tensors as concrete tunables, and its hot path is exactly the per-step decode metadata build that the CUDA-graph design targets. The finding contributes the specific structuring idea of a batch-descriptor-driven dispatcher with a graph-compatible fast path and a safe fallback, which maps directly onto separating uniform-decode replays (dominant in multi-turn agentic TPOT) from mixed/prefill builds (TTFT). This addresses the gap that the current build recomputes scheduler_metadata and reallocates cascade tensors even when successive decode steps share the same shape, which is the common case under CUDA graphs. (from finding #4: CUDA Graphs)
    - [claude] Pipeline AOT scheduler_metadata across steps via a helper-thread build so build() returns before get_scheduler_metadata finishes — None of the four listed deep_research_proposals move `get_scheduler_metadata` off the critical path via cross-step pipelining. Findings 0001 and 0004 propose *shape-keyed caching* of the cascade branch's `prefix_scheduler_metadata` and cascade prefix tensors — they only hit when the same shape recurs, and they still execute synchronously inside the current step on the first occurrence and after any invalidation. Finding 0009 introduces a batch-descriptor cache for CUDA-graph-compatible replay but likewise operates synchronously within one step and targets the descriptor-keyed cache lookup, not asynchronous overlap with the model forward. Finding 0006 targets H2D transfer batching and pinned buffers, not compute latency of the scheduler planner itself. This proposal is orthogonal: it addresses the *latency of the planner call*, not its allocation cost or its cacheability, by exploiting that in a uniform-decode multi-turn agentic workload the next step's shape is deterministically derivable one step in advance, so the planner call can execute concurrently with the current step's model forward on a helper stream and be awaited (as a cheap stream wait) at the next build() entry. This composes cleanly with all four listed cache-based proposals — a cache hit short-circuits before the speculation is consumed — and directly attacks median TPOT beyond what cache reuse alone can achieve, since it removes wall-clock time from the per-token critical path even on cache misses within the class of uniform-decode transitions. (agent proposal, no source finding)
