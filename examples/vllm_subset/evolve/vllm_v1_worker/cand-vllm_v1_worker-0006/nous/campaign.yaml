    ## Research findings (3)
    1. [RFC]: Multi-Step Scheduling — issue — https://github.com/vllm-project/vllm/issues/6854
       Technique: Adopt a worker-local multi-step decode loop that keeps sampled tokens on GPU, advances next-step input metadata with CUDA kernels, and delays scheduler/output synchronization until lookahead slots are exhausted. This directly targets median TPOT by amortizing per-token Python input prep, output materialization, and scheduler overhead across multiple decode iterations in agentic multi-turn traffic. | Evidence: "Quote: "Multi-step decoding will be able to amortize all these overheads over n-steps at a time." Quote: "Update inputs for the next step. We use Cuda kernels for faster updates because Torch is too slow." Pointer: Motivation and High level Algorithm, lines 166-174 and 213-220."
    2. Model Runner V2 Design Document — docs — https://docs.vllm.ai/en/v0.17.0/design/model_runner_v2/
       Technique: Decouple persistent request state from per-step input tensors, assign active requests stable rows, and gather per-step inputs from mostly GPU-resident state. This reduces request-churn bookkeeping and avoids tensor-wide reordering on the critical TTFT/TPOT path. | Evidence: "Quote: "MRV2 decouples persistent state tensors from per-step input tensors." Quote: "Large state tensors are mostly stored on GPU memory, so gather runs in parallel on the GPU with low overhead." Pointer: Persistent Batch / MRV2's Solution, lines 2360-2367."
    3. vLLM v0.6.0: 2.7x Throughput Improvement and 5x Latency Reduction — blog — https://vllm-project.github.io/2024/09/05/perf-update.html
       Technique: Overlap output processing with the next model execution step instead of synchronously converting GPU tensors to Python lists and checking stop criteria after every token. The worker output path could further delay or batch materialization to reduce TPOT bubbles from token IDs, logprobs, NaN counts, and fault flags. | Evidence: "Quote: "we introduced asynchronous output processing, which overlaps the output processing with model execution." Quote: "vLLM now delays it, performing the processing of the `n`-th step output while executing the `n+1`-th step." Pointer: Asynchronous output processing section."

    ## Existing proposals (5)
    ← seeds/inspiration, the evolver may extend or discard
    - [proposal_from_finding_creator] Batch multiple decode steps before running _bookkeeping_sync to amortize its host work — The candidate's hottest costs are exactly the two the RFC calls out: a synchronous D2H list conversion (_to_list at 3829) and per-decode-step Python bookkeeping that must run once per generated token. The existing async-scheduling branch already keeps sampled_token_ids on GPU for a single step, which shows the mechanism is viable here; the finding extends that idea by amortizing the same host work across N steps, directly cutting median TPOT for the multi-turn agentic workload named in the caller context, where decode dominates and per-token host overhead is repeatedly paid. The RFC's specific recommendation to use CUDA kernels for next-step input updates maps cleanly onto replacing the per-request scatter loop at 3868-3893. (from finding #1: [RFC]: Multi-Step Scheduling)
    - [proposal_from_finding_creator] Adopt MRV2 persistent-state/per-step decoupling to eliminate _bookkeeping_sync host roundtrip — The candidate explicitly calls out self._to_list(sampled_token_ids) and the per-sampled-request update loop as the concrete sync/Python-work targets that hurt median TPOT under multi-turn agentic workloads. The MRV2 finding contributes exactly the transferable idea needed to attack that: keep large per-request state tensors GPU-resident and gather/scatter per-step inputs and outputs on the GPU rather than reordering or copying them back to host every step. That directly addresses the gap in _bookkeeping_sync where a full device->host sync plus a Python loop is used to maintain what is fundamentally row-indexed persistent state, and it plausibly reduces the post-sample host stall that dominates TPOT after decode in the legacy synchronous path. (from finding #2: Model Runner V2 Design Document)
    - [proposal_from_finding_creator] Pipeline sync bookkeeping behind the next step to eliminate the _to_list D2H stall — The finding describes the exact optimization vLLM v0.6.0 applied at the engine level — overlap output processing (GPU→CPU token materialization, stop-criteria checks) with the next step's model execution — and this candidate is the surviving synchronous instance of that pattern inside the v1 worker. Today `_to_list` forces an `event.synchronize()` on the async copy stream (per the comment at lines 3812-3815) inside the current step's critical path, and the CPU-side loop at 3868-3893 runs before the runner can launch the next forward. Both are pure host work that could be scheduled after the next `execute_model` launches, directly attacking median TPOT on the multi-turn agentic workload described in the caller context. The async-scheduling branch already demonstrates that the per-step CPU tensor updates are not required for the *next* step's input preparation (it caches `prev_sampled_token_ids` on GPU instead), which is precisely the invariant the async-output-processing technique relies on — strong evidence the transfer of the idea is feasible for the sync path rather than merely topical. (from finding #3: vLLM v0.6.0: 2.7x Throughput Improvement and 5x Latency Reduction)
    - [claude] Issue sampled_token_ids D2H immediately after sampling and vectorize the per-request CPU scatter with NumPy fancy indexing — None of the three listed deep_research_proposals contain either half of this proposal. (1) The RFC multi-step batching proposal (find-vllm_v1_worker-0001) explicitly amortizes bookkeeping across N steps and replaces per-step Python bookkeeping with CUDA kernels — a scheduler/RFC-level rewrite; this proposal preserves single-step semantics and does not touch the scheduler. (2) The MRV2 proposal (find-vllm_v1_worker-0003) migrates token_ids_cpu / is_token_ids / num_tokens_no_spec off host to persistent GPU tensors and does the scatter as a GPU kernel; this proposal keeps them as pinned CPU NumPy views and instead uses NumPy fancy indexing, which is far less invasive and does not require reworking every other consumer of those CPU views (gpu_input_batch.py:376-390, 526-527, 631-637, 765) that assume they are host-side arrays. (3) The v0.6.0-style async-output-processing proposal (find-vllm_v1_worker-0004) pushes the D2H wait and the per-request loop to AFTER the next execute_model launches, requiring a DeferredBookkeeping handle API and coordination with KV-connector finalize / EPLB / draft-after-bookkeeping consumers that today expect finalized state before execute_model returns. This proposal is orthogonal: it pulls the D2H ISSUE earlier within the current step (overlapping only with the drafter block that already runs before bookkeeping) rather than pushing the WAIT later across the step boundary, so downstream consumers still see finalized bookkeeping when execute_model returns. Additionally, the NumPy vectorization of the 3868-3893 loop attacks the pure Python per-request overhead that persists under proposals #1, #3, and #4 (and under #2 only if the full GPU-state migration ships), giving a meaningful TPOT win with a much smaller blast radius than any of the three existing proposals. (agent proposal, no source finding)
    - [codex] Fast-path bookkeeping for empty or fully discarded sampled rows — The listed deep-research proposals target broad scheduling or state-placement changes: multi-step batching, persistent GPU-resident state, or deferring bookkeeping behind the next step. Agent A targets earlier D2H issue and NumPy vectorization of the normal single-token scatter. None of them propose changing the discard handling order so invalid rows are filtered before `_to_list`, nor an early exit for fully discarded sampled batches. This is a narrower guard/compaction optimization around the existing discard semantics rather than an async pipeline, GPU-state migration, multi-step decode rewrite, or CPU scatter vectorization. (agent proposal, no source finding)
