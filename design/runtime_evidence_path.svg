<svg viewBox="0 0 900 1150" width="900" height="1150" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Inter, system-ui, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4a4a"/>
    </marker>
    <marker id="arr-bus" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#be185d"/>
    </marker>
    <style>
      .title  { font-weight:600; font-size:15px; fill:#1a1a1a; }
      .body   { font-weight:400; font-size:12px; fill:#4a4a4a; }
      .mono   { font-family: ui-monospace, Menlo, monospace; font-weight:500; font-size:13px; fill:#1a1a1a; }
      .line   { stroke:#4a4a4a; stroke-width:1.6; fill:none; }
      .panel  { fill:#fff; stroke:#1a1a1a; stroke-width:1.4; }
      .mgr    { fill:#fffbe6; stroke:#a16207; stroke-width:1.6; stroke-dasharray:6 4; }
      .env    { fill:#f1f5f9; stroke:#64748b; stroke-width:1.6; stroke-dasharray:6 4; }
      .s0     { fill:#f5f5f5; stroke:#525252; stroke-width:1.6; }
      .s1     { fill:#fff7e6; stroke:#d97706; stroke-width:1.6; }
      .s2     { fill:#f3edff; stroke:#7c3aed; stroke-width:1.6; }
      .s3     { fill:#eff6ff; stroke:#2563eb; stroke-width:1.6; }
      .s4     { fill:#fef2f2; stroke:#dc2626; stroke-width:1.6; }
      .s5     { fill:#fff1f7; stroke:#be185d; stroke-width:1.6; }
      .skip   { fill:#f1f5f9; stroke:#64748b; stroke-width:1.4; stroke-dasharray:4 3; }
      .out    { fill:#ecfdf5; stroke:#059669; stroke-width:1.6; }
      .label  { font-weight:600; font-size:11px; fill:#666; letter-spacing:0.08em; }
      .loop   { fill:none; stroke:#1a1a1a; stroke-width:1.2; stroke-dasharray:5 5; }
      .bus       { stroke:#be185d; stroke-width:1.6; stroke-dasharray:6 4; fill:none; }
      .bus-label { font-weight:600; font-size:11px; fill:#be185d; letter-spacing:0.08em; }
      .bus-note  { font-style:italic; font-size:11px; fill:#be185d; }
      .note      { font-style:italic; font-size:11px; fill:#666; }
    </style>
  </defs>

  <rect width="900" height="1150" fill="#fafafa"/>

  <!-- frames are painted first so every edge and label draws on top of them -->
  <rect x="30" y="16" width="840" height="168" rx="12" class="env"/>
  <rect x="30" y="302" width="840" height="762" rx="12" class="mgr"/>
  <rect x="60" y="398" width="720" height="358" rx="12" class="loop"/>

  <!-- ============ BEFORE SPOTLIGHTS: the user's environment ============ -->
  <text x="50" y="42" class="label">BEFORE SPOTLIGHTS</text>
  <text x="50" y="64" class="title">The user's environment — captured with existing tools</text>

  <g transform="translate(52,78)">
    <rect width="236" height="92" rx="10" class="s1"/>
    <text x="16" y="24" class="label">PROFILER RUN</text>
    <text x="16" y="46" class="title">Profile files</text>
    <text x="16" y="64" class="body">CPU / wall: pprof, collapsed</text>
    <text x="16" y="80" class="body">memory: heap pprof, bytes</text>
  </g>

  <g transform="translate(308,78)">
    <rect width="236" height="92" rx="10" class="s3"/>
    <text x="16" y="24" class="label">COVERAGE-ENABLED RUN</text>
    <text x="16" y="46" class="title">Coverage files</text>
    <text x="16" y="64" class="body">LCOV, Cobertura XML</text>
    <text x="16" y="80" class="body">executable and hit lines</text>
  </g>

  <g transform="translate(606,78)">
    <rect width="236" height="92" rx="10" class="s5"/>
    <text x="16" y="24" class="label">APPLICATION LOGS</text>
    <text x="16" y="46" class="title">Log window</text>
    <text x="16" y="64" class="body">plain text, never parsed</text>
    <text x="16" y="80" class="body">bounded head + tail excerpt</text>
  </g>

  <!-- evidence files merge into the run -->
  <path class="line" d="M170 170 V 177 H 300"/>
  <path class="line" d="M426 170 V 177 H 300"/>
  <path class="line" marker-end="url(#arr)" d="M300 177 V 436"/>
  <text x="310" y="250" class="label">EVIDENCE FILES</text>

  <!-- log window bypasses the evidence step entirely -->
  <path class="bus" marker-end="url(#arr-bus)" d="M724 170 V 177 H 800 V 826 H 490"/>
  <text x="788" y="326" text-anchor="end" class="bus-label">LOG WINDOW BYPASSES THE EVIDENCE STEP</text>
  <text x="788" y="344" text-anchor="end" class="bus-note">a bounded head + tail excerpt goes straight</text>
  <text x="788" y="360" text-anchor="end" class="bus-note">into the system-map prompt: reading context,</text>
  <text x="788" y="376" text-anchor="end" class="bus-note">never parsed, projected, or stored</text>

  <!-- optional metadata -->
  <g transform="translate(430,196)">
    <rect width="340" height="94" rx="8" class="skip"/>
    <text x="16" y="24" class="label">OPTIONAL METADATA</text>
    <text x="16" y="46" class="body">capture.json only for a directory input</text>
    <text x="16" y="64" class="body">run flags: --workload, --coverage-complete,</text>
    <text x="16" y="82" class="body">--evidence-revision, --profile-type</text>
  </g>

  <!-- ============ SPOTLIGHTS RUN ============ -->
  <text x="50" y="328" class="label">SPOTLIGHTS RUN</text>
  <text x="50" y="350" class="title">SpotlightsManager</text>
  <text x="50" y="368" class="body">tree → filter → evidence → map</text>
  <text x="50" y="386" class="body">grey = deterministic · violet = agent</text>

  <!-- deterministic evidence step -->
  <text x="78" y="422" class="label">DETERMINISTIC — NO LLM</text>

  <g transform="translate(100,436)">
    <rect width="400" height="92" rx="10" class="s0"/>
    <text x="18" y="24" class="label">EVIDENCE STEP · 1</text>
    <text x="18" y="46" class="title">Parse and normalize</text>
    <text x="18" y="64" class="body">sniff format; one streaming parser per format</text>
    <text x="18" y="80" class="body">Out: ProfileDigest, CoverageDigest</text>
  </g>
  <path class="line" marker-end="url(#arr)" d="M300 528 V 550"/>

  <g transform="translate(100,550)">
    <rect width="400" height="92" rx="10" class="s0"/>
    <text x="18" y="24" class="label">EVIDENCE STEP · 2</text>
    <text x="18" y="46" class="title">Project onto repository code</text>
    <text x="18" y="64" class="body">files, functions, modules; --path-rewrite</text>
    <text x="18" y="80" class="body">confidence: exact / symbol / heuristic</text>
  </g>

  <g transform="translate(536,556)">
    <rect width="228" height="78" rx="10" class="s0"/>
    <text x="18" y="26" class="title">Module tree</text>
    <text x="18" y="46" class="body">existing, unchanged</text>
    <text x="18" y="62" class="body">+ repo symbol index</text>
  </g>
  <path class="line" marker-end="url(#arr)" d="M536 595 H 500"/>

  <path class="line" marker-end="url(#arr)" d="M300 642 V 664"/>

  <g transform="translate(100,664)">
    <rect width="400" height="74" rx="10" class="panel"/>
    <text x="18" y="22" class="label">EVIDENCE STEP · 3</text>
    <text x="18" y="44" class="mono">runtime_evidence.json</text>
    <text x="18" y="62" class="body">the sidecar; every consumer reads this</text>
  </g>

  <!-- sidecar to the system map -->
  <path class="line" marker-end="url(#arr)" d="M300 738 V 778"/>

  <g transform="translate(110,778)">
    <rect width="380" height="96" rx="10" class="s2"/>
    <text x="16" y="24" class="label">CONSUMER · AGENT CALL</text>
    <text x="16" y="46" class="title">System map</text>
    <text x="16" y="66" class="body">A seeds (det.) · B one agent call · C validation</text>
    <text x="16" y="84" class="body">B also reads the log excerpt</text>
  </g>

  <!-- sidecar rail to the remaining consumers -->
  <path class="line" d="M100 701 H 78 V 906 H 717"/>
  <path class="line" marker-end="url(#arr)" d="M177 906 V 932"/>
  <path class="line" marker-end="url(#arr)" d="M447 906 V 932"/>
  <path class="line" marker-end="url(#arr)" d="M717 906 V 932"/>

  <!-- the map is read by discovery -->
  <path class="line" marker-end="url(#arr)" d="M250 874 V 932"/>

  <g transform="translate(52,932)">
    <rect width="250" height="96" rx="10" class="s2"/>
    <text x="16" y="24" class="label">CONSUMER · AGENT CALLS</text>
    <text x="16" y="46" class="title">Candidate discovery</text>
    <text x="16" y="66" class="body">one agent call per module</text>
    <text x="16" y="84" class="body">reads module rollup</text>
  </g>

  <g transform="translate(322,932)">
    <rect width="250" height="96" rx="10" class="s0"/>
    <text x="16" y="24" class="label">CONSUMER · DETERMINISTIC</text>
    <text x="16" y="46" class="title">Ranking</text>
    <text x="16" y="66" class="body">measured columns per type</text>
    <text x="16" y="84" class="body">modest boost, no override</text>
  </g>

  <g transform="translate(592,932)">
    <rect width="250" height="96" rx="10" class="s0"/>
    <text x="16" y="24" class="label">CONSUMER · DETERMINISTIC</text>
    <text x="16" y="46" class="title">Preparation, validation</text>
    <text x="16" y="66" class="body">covering harness entries</text>
    <text x="16" y="84" class="body">before/after is diagnostic</text>
  </g>

  <!-- OUTPUT -->
  <path class="line" d="M177 1028 V 1046"/>
  <path class="line" d="M447 1028 V 1046"/>
  <path class="line" d="M717 1028 V 1046"/>
  <path class="line" d="M177 1046 H 717"/>
  <path class="line" marker-end="url(#arr)" d="M447 1046 V 1084"/>

  <g transform="translate(290,1084)">
    <rect width="320" height="44" rx="8" class="out"/>
    <text x="160" y="28" text-anchor="middle" class="mono">SpotlightReport · index.md</text>
  </g>

</svg>
